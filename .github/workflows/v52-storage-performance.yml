name: V52 Storage and navigation performance

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v52_storage_performance_patch.py'
      - '.github/workflows/v52-storage-performance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V52 patch
        run: python .github/scripts/v52_storage_performance_patch.py

      - name: Verify V52 markers
        run: |
          grep -q 'Inversor Fácil V52 · Rendimiento + almacenamiento estable' index.html
          grep -q "if(source==='radar')syncToRadar(symbol,values);" index.html
          grep -q "window.v51RenderVisible('v52-history')" index.html
          grep -q 'v52HistoryStamp' index.html
          grep -q 'setInterval(tick,60000)' index.html

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V52 fix storage quota and section lag [skip ci]"
          git push
