name: V50 Top500 shared frontend patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v49-top500-shared.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V50 patch
        run: python .github/scripts/v50_patch.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix shared Top 500 sync for all users [skip ci]"
          git push
# retry-2
