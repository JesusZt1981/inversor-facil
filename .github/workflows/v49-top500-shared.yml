name: V49 Top500 shared patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v49-top500-shared.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_save = 'function top500Save(d){localStorage.setItem(TOP500_KEY,JSON.stringify(d));}'
          new_save = '''function top500Save(d){\n  localStorage.setItem(TOP500_KEY,JSON.stringify(d));\n  if(typeof window.v49ScheduleTop500Publish===\"function\") window.v49ScheduleTop500Publish(d);\n}'''
          if old_save not in s:
              raise SystemExit('No se encontro top500Save esperado')
          s = s.replace(old_save, new_save, 1)

          old_loop = '  for(const r of data){\n    const a=bySymbol.get(r.symbol);'
          new_loop = '  for(const r of data){\n    if(String(r.symbol||\"\").startsWith(\"T5SYS\")) continue;\n    const a=bySymbol.get(r.symbol);'
          if old_loop not in s:
              raise SystemExit('No se encontro loop de shared_catalog esperado')
          s = s.replace(old_loop, new_loop, 1)

          marker = '/* ===== V49 · Top 500 compartido entre dispositivos/usuarios ===== */'
          if marker not in s:
              patch = r'''\n<script>\n/* ===== V49 · Top 500 compartido entre dispositivos/usuarios ===== */\n(function(){\n  const PREFIX=\"T5SYS\";\n  const CHUNK=35000;\n  let publishTimer=null;\n  let busy=false;\n  let lastPublished=\"\";\n\n  function admin(){\n    try{return typeof v27IsAdmin===\"function\" && v27IsAdmin();}catch(e){return false;}\n  }\n\n  function normalize(d){\n    return {\n      version:49,\n      target:Number(d?.target)||500,\n      universe:Array.isArray(d?.universe)?d.universe:[],\n      metrics:(d?.metrics&&typeof d.metrics===\"object\")?d.metrics:{},\n      lastUniverseLoad:d?.lastUniverseLoad||null,\n      lastAnalysis:d?.lastAnalysis||null,\n      publishedAt:new Date().toISOString()\n    };\n  }\n\n  async function publish(d){\n    if(busy||!admin()||typeof v24Supabase===\"undefined\") return;\n    const snap=normalize(d||top500Load());\n    if(!snap.universe.length) return;\n    const raw=JSON.stringify(snap);\n    const fingerprint=(snap.lastAnalysis||\"\")+\"|\"+raw.length;\n    if(fingerprint===lastPublished) return;\n    busy=true;\n    try{\n      const chunks=[];\n      for(let i=0;i<raw.length;i+=CHUNK) chunks.push(raw.slice(i,i+CHUNK));\n      const now=new Date().toISOString();\n      const rows=chunks.map((part,i)=>({\n        symbol:`${PREFIX}${String(i).padStart(2,\"0\")}`,\n        name:i===0?`Top 500 compartido · ${chunks.length} partes`:`Top 500 compartido · parte ${i+1}`,\n        asset_type:\"stock\",\n        risk:\"Bajo\",\n        price:1,\n        currency:\"USD\",\n        exchange:\"SYSTEM\",\n        country:\"SYSTEM\",\n        sector:\"SYSTEM\",\n        dividend:\"No determinado\",\n        aliases:part,\n        daily_percent:null,\n        daily_change:null,\n        market_date:null,\n        fractional_note:`SYSTEM_TOP500_V49:${chunks.length}`,\n        updated_at:now\n      }));\n      const {error}=await v24Supabase.from(\"shared_catalog\").upsert(rows,{onConflict:\"symbol\"});\n      if(error) throw error;\n      lastPublished=fingerprint;\n      console.info(`V49: Top 500 publicado en ${chunks.length} partes.`);\n    }catch(e){\n      console.warn(\"V49: no se pudo publicar Top 500 compartido\",e);\n    }finally{busy=false;}\n  }\n\n  async function loadShared(){\n    if(typeof v24Supabase===\"undefined\") return false;\n    try{\n      const {data,error}=await v24Supabase\n        .from(\"shared_catalog\")\n        .select(\"symbol,aliases,fractional_note,updated_at\")\n        .like(\"symbol\",`${PREFIX}%`)\n        .order(\"symbol\",{ascending:true});\n      if(error) throw error;\n      if(!data?.length) return false;\n      const rows=data.filter(r=>String(r.symbol||\"\").startsWith(PREFIX));\n      if(!rows.length) return false;\n      const firstNote=String(rows[0].fractional_note||\"\");\n      const expected=Number(firstNote.split(\":\").pop())||rows.length;\n      const usable=rows.slice(0,expected);\n      if(usable.length<expected) return false;\n      const raw=usable.map(r=>r.aliases||\"\").join(\"\");\n      const snap=JSON.parse(raw);\n      if(!Array.isArray(snap.universe)||!snap.universe.length) return false;\n\n      const local=top500Load();\n      const cloudTime=Date.parse(snap.lastAnalysis||snap.publishedAt||0)||0;\n      const localTime=Date.parse(local.lastAnalysis||0)||0;\n      const shouldApply=!admin() || !local.universe.length || cloudTime>localTime;\n      if(shouldApply){\n        localStorage.setItem(TOP500_KEY,JSON.stringify({\n          target:Number(snap.target)||500,\n          universe:snap.universe,\n          metrics:snap.metrics||{},\n          lastUniverseLoad:snap.lastUniverseLoad||null,\n          lastAnalysis:snap.lastAnalysis||null\n        }));\n        try{renderTop500();if(window.v32Paginate)window.v32Paginate();}catch(e){}\n        const st=document.getElementById(\"v48Top500PersistentStatus\");\n        if(st && !admin()) st.title=\"Ranking compartido por el administrador y sincronizado desde la nube.\";\n      }\n      return true;\n    }catch(e){\n      console.warn(\"V49: no se pudo cargar Top 500 compartido\",e);\n      return false;\n    }\n  }\n\n  window.v49ScheduleTop500Publish=function(d){\n    if(!admin()) return;\n    clearTimeout(publishTimer);\n    publishTimer=setTimeout(()=>publish(d||top500Load()),30000);\n  };\n  window.v49LoadTop500Shared=loadShared;\n  window.v49PublishTop500Shared=()=>publish(top500Load());\n\n  async function boot(){\n    // Espera a que Auth/perfil terminen de resolver el rol.\n    for(let i=0;i<12;i++){\n      await new Promise(r=>setTimeout(r,500));\n      if(typeof v24Supabase!==\"undefined\" && (typeof v27Profile!==\"undefined\" || i>5)) break;\n    }\n    if(admin()) await publish(top500Load());\n    await loadShared();\n  }\n\n  document.addEventListener(\"DOMContentLoaded\",()=>{setTimeout(boot,900);});\n  document.addEventListener(\"visibilitychange\",()=>{if(document.visibilityState===\"visible\")loadShared();});\n  window.addEventListener(\"focus\",()=>loadShared());\n  setInterval(()=>loadShared(),300000);\n})();\n</script>\n'''
              if '</body>' not in s:
                  raise SystemExit('No se encontro </body>')
              s = s.replace('</body>', patch + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Top 500 shared visibility on mobile and other users [skip ci]"
          git push
