name: Build Mis Finanzas Android V2

on:
  push:
    branches:
      - mis-finanzas-android-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail
          cat android-v2-project.b64.part00 android-v2-project.b64.part01 android-v2-project.b64.part02 android-v2-project.b64.part03 > android-v2-project.b64
          base64 -d android-v2-project.b64 > android-v2-project.zip
          mkdir -p android-v2
          unzip -q android-v2-project.zip -d android-v2
          test -f android-v2/settings.gradle
          test -f android-v2/app/build.gradle

      - name: Build release APK
        working-directory: android-v2
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Generate signing key and sign APK
        shell: bash
        run: |
          set -euxo pipefail
          UNSIGNED="android-v2/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$UNSIGNED" Mis-Finanzas-Local-2.0.0-unsigned.apk
          SIGN_PASS="MF2-$(openssl rand -hex 14)"
          printf '%s' "$SIGN_PASS" > .sign-pass
          keytool -genkeypair -v             -keystore Mis-Finanzas-Local-v2-signing.jks             -alias misfinanzasv2             -keyalg RSA -keysize 2048 -validity 10000             -storepass "$SIGN_PASS" -keypass "$SIGN_PASS"             -dname "CN=Mis Finanzas Local V2, OU=Personal, O=Mis Finanzas, L=Ciudad Juarez, ST=Chihuahua, C=MX"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign             --ks Mis-Finanzas-Local-v2-signing.jks             --ks-key-alias misfinanzasv2             --ks-pass "pass:$SIGN_PASS"             --key-pass "pass:$SIGN_PASS"             --out Mis-Finanzas-Local-2.0.0.apk             Mis-Finanzas-Local-2.0.0-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs Mis-Finanzas-Local-2.0.0.apk | tee APK-VERIFY.txt
          {
            echo "Mis Finanzas Local v2 - clave de firma"
            echo
            echo "Alias: misfinanzasv2"
            echo "Password del keystore: $SIGN_PASS"
            echo "Password de la clave: $SIGN_PASS"
            echo
            echo "IMPORTANTE: conserva este archivo y Mis-Finanzas-Local-v2-signing.jks."
            echo "Las próximas versiones con el mismo applicationId deben firmarse con esta misma clave."
          } > SIGNING-INFO.txt
          sha256sum Mis-Finanzas-Local-2.0.0.apk > SHA256.txt

      - name: Upload signed APK and update key
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Finanzas-Local-2.0.0-release
          path: |
            Mis-Finanzas-Local-2.0.0.apk
            SHA256.txt
            APK-VERIFY.txt
            Mis-Finanzas-Local-v2-signing.jks
            SIGNING-INFO.txt
          if-no-files-found: error
          retention-days: 7
