name: Build Mis Finanzas Android V2

on:
  push:
    branches:
      - mis-finanzas-android-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail
          cat android-v2-project.b64.part00 android-v2-project.b64.part01 android-v2-project.b64.part02 android-v2-project.b64.part03 > android-v2-project.b64
          base64 -d android-v2-project.b64 > android-v2-project.zip
          mkdir -p android-v2
          unzip -q android-v2-project.zip -d android-v2
          test -f android-v2/settings.gradle
          test -f android-v2/app/build.gradle

      - name: Apply 2.1 interface and reminder patch
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d android-v2-2.1.patch.gz.b64 | gzip -d > android-v2-2.1.patch
          sed -i 's#mis-finanzas-android-v2-backup-before-2.1/#android-v2/#g; s#mis-finanzas-android-v2/#android-v2/#g' android-v2-2.1.patch
          patch -p0 < android-v2-2.1.patch
          grep -q "versionName '2.1.0'" android-v2/app/build.gradle
          grep -q 'data-theme="violet"' android-v2/app/src/main/assets/index.html
          grep -q 'payment_reminders_v21' android-v2/app/src/main/java/com/misfinanzas/local/ReminderReceiver.java

      - name: Build unsigned release APK
        working-directory: android-v2
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          cp android-v2/app/build/outputs/apk/release/app-release-unsigned.apk Mis-Finanzas-Local-2.1.0-unsigned.apk
          sha256sum Mis-Finanzas-Local-2.1.0-unsigned.apk > SHA256-unsigned.txt

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Finanzas-Local-2.1.0-unsigned
          path: |
            Mis-Finanzas-Local-2.1.0-unsigned.apk
            SHA256-unsigned.txt
          if-no-files-found: error
          retention-days: 7
